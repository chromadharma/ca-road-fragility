# Makes the engine installable so other studies can import it, e.g.
#   pip install "hazardnet @ git+https://github.com/chromadharma/ca-road-fragility@v0.1.0"
# Only hazardnet/ is packaged; studies/, viz/ and site/ stay repo-local.
# requirements.txt keeps the exact pins this repo's own results were run with.
[build-system]
requires = ["setuptools>=77"]   # PEP 639 licence string
build-backend = "setuptools.build_meta"

[project]
name = "hazardnet"
version = "0.1.0"
description = "Hazard x road network x accessibility engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "python-igraph>=0.11",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "osmnx>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
pbf = ["osmium>=4.0"]   # hazardnet.osm_pbf, the local-extract fallback to Overpass
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/chromadharma/ca-road-fragility"

[tool.setuptools]
packages = ["hazardnet"]
